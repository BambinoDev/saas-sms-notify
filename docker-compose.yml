version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: notify_sms_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - notify_sms_network
    environment:
      - TZ=Africa/Abidjan
      - PHP_OPCACHE_ENABLE=1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: notify_sms_nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - notify_sms_network
    environment:
      - TZ=Africa/Abidjan
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: notify_sms_postgres
    networks:
      - notify_sms_network
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=notify_sms_db
      - POSTGRES_USER=laravel
      - POSTGRES_PASSWORD=secret
      - TZ=Africa/Abidjan
    volumes:
      - notify_sms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d notify_sms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notify_sms_redis
    networks:
      - notify_sms_network
    ports:
      - "6380:6379"
    volumes:
      - notify_sms_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      - TZ=Africa/Abidjan
    restart: unless-stopped

  node:
    image: node:22-alpine
    container_name: notify_sms_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5174:5173"
    networks:
      - notify_sms_network
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host; else echo 'Waiting for Laravel installation...' && sleep infinity; fi"
    depends_on:
      - app
    environment:
      - TZ=Africa/Abidjan
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: notify_sms_pgadmin
    networks:
      - notify_sms_network
    ports:
      - "5051:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@notify-sms.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - notify_sms_pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notify_sms_mailhog
    networks:
      - notify_sms_network
    ports:
      - "1026:1025"
      - "8026:8025"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: notify_sms_scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - notify_sms_network
    environment:
      - TZ=Africa/Abidjan
      - PHP_OPCACHE_ENABLE=1
    restart: unless-stopped
    command: sh -c "echo 'Starting Laravel Scheduler...' && while true; do php artisan schedule:run --verbose --no-interaction >> /var/www/html/storage/logs/scheduler.log 2>&1; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: notify_sms_worker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - notify_sms_network
    environment:
      - TZ=Africa/Abidjan
      - PHP_OPCACHE_ENABLE=1
      - CACHE_STORE=redis
      - REDIS_HOST=notify_sms_redis
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  notify_sms_postgres_data:
  notify_sms_redis_data:
  notify_sms_pgadmin_data:

networks:
  notify_sms_network:
    driver: bridge